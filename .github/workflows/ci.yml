
name: Portfolio CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    name: Verify portfolio
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Check JavaScript syntax
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r -d '' file; do
            echo "Checking $file"
            node --experimental-default-type=module --check "$file"
          done < <(find src -type f -name '*.js' -print0)

      - name: Check required files
        run: |
          test -f index.html
          test -f src/main.js
          test -f src/data/portfolio.js
          test -f assets/resume/Dhruv_Bhavsar_Resume.docx
          test -f README.md
          echo "Required files are present."
